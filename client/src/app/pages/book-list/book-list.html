<main class="min-h-screen bg-gray-950 text-white">
    <ul class="grid grid-cols-2 lg:grid-cols-4 xl:grid-cols-6 gap-4">
        @if (isLoading()) {
        <p class="text-gray-400">Loading...</p>
        } @else {
        @for (book of books(); track book.id) {
        <li class="bg-gray-800 rounded-lg shadow p-4 hover:shadow-md flex flex-col gap-3">
            <a [routerLink]="['book', book.id]">
                <img [src]="book.coverUrl" class="w-48 h-64 object-cover rounded-lg shadow-lg shrink-0" />
            </a>
            <a [routerLink]="['book', book.id]" class="text-xl font-bold hover:text-blue-500">{{
                book.title
                }}</a>
        </li>
        }
        }
    </ul>
</main>
