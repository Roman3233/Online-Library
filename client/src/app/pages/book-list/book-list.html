<main class="min-h-screen bg-gray-950 text-white px-4 py-6 sm:px-6">
    @if (isLoading()) {
    <p class="text-gray-400">Loading...</p>
    } @else {
    <ul class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
        @for (book of books(); track book.id) {
        <li class="bg-gray-800 rounded-lg overflow-hidden hover:bg-gray-700 transition cursor-pointer">
            <a [routerLink]="['/book', book.id]">
                <img [src]="book.coverUrl" class="w-full aspect-[3/4] object-cover" />
                <div class="p-3">
                    <p class="text-sm font-semibold truncate">{{ book.title }}</p>
                    <p class="text-xs text-gray-400 truncate">{{ book.author }}</p>
                </div>
            </a>
        </li>
        }
    </ul>
    }
</main>
