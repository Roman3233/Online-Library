<main class="min-h-screen bg-gray-950 text-white flex items-center justify-center px-6">
    <div class="w-full max-w-md bg-gray-900 rounded-xl p-8 flex flex-col gap-5">

        <div>
            <h1 class="text-3xl font-bold">Create an account</h1>
            <p class="text-gray-500 mt-1 text-sm">Create a free account to access all features</p>
        </div>

        <input type="text" [(ngModel)]="username" placeholder="Username"
            class="bg-gray-800 border border-gray-700 px-3 py-2 rounded-lg text-white focus:outline-none focus:border-emerald-500">

        <input type="email" [(ngModel)]="email" placeholder="Email"
            class="bg-gray-800 border border-gray-700 px-3 py-2 rounded-lg text-white focus:outline-none focus:border-emerald-500">

        <input type="password" [(ngModel)]="password" placeholder="Password"
            class="bg-gray-800 border border-gray-700 px-3 py-2 rounded-lg text-white focus:outline-none focus:border-emerald-500">

        <button (click)="onRegister()"
            class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-white cursor-pointer transition">
            Register
        </button>

        <p class="text-sm text-gray-500">
            Already have an account?
            <a routerLink="/login" class="text-emerald-400 hover:text-emerald-300">Login here</a>
        </p>

    </div>
</main>
